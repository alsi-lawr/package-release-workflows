name: Package

on:
  workflow_call:
    inputs:
      package_name:
        description: Command/binary name used for validation.
        type: string
        required: true
      package_version:
        description: Optional strict X.Y.Z version for non-tag qualification runs; tags remain authoritative by default.
        type: string
        required: false
        default: ""
      shared_helpers_ref:
        description: Ref of this repository used for runtime helper scripts; defaults to main for existing callers.
        type: string
        required: false
        default: main
      source_archive_template:
        description: Optional source tarball name with {package_name} and {version} placeholders.
        type: string
        required: false
        default: ""
      source_cargo_toolchain:
        description: Optional Rust toolchain needed by the caller's source finalizer.
        type: string
        required: false
        default: ""
      dotnet_version:
        description: .NET version to install.
        type: string
        required: true
      dotnet_project_path:
        description: Path to the .NET project file.
        type: string
        required: true
      package_smoke_script:
        description: Platform script base path to validate the published binary (.sh or .ps1).
        type: string
        required: true
      package_metadata_finalize_script:
        description: Bash script that finalizes caller-specific package metadata.
        type: string
        required: true
      package_publish_matrix:
        description: JSON array describing publish matrix entries.
        type: string
        required: true
      package_publish_prepare_script:
        description: Optional platform script base path that prepares each RID publish directory.
        type: string
        required: false
        default: ""
      package_publish_script:
        description: Optional platform script base path that builds a complete RID payload instead of dotnet publish.
        type: string
        required: false
        default: ""
      jreleaser_image:
        description: JReleaser container image.
        type: string
        required: true
      jreleaser_config:
        description: Path to JReleaser config file.
        type: string
        required: true
      nix_package_name:
        description: Nix package attribute name used in version validation.
        type: string
        required: true
    outputs:
      version:
        description: Release version without the v prefix.
        value: ${{ jobs.version.outputs.version }}
      revision:
        description: Source revision used for the package.
        value: ${{ jobs.version.outputs.revision }}

permissions:
  contents: read
  attestations: write
  id-token: write

jobs:
  version:
    name: Validate and compare the release version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.version.outputs.revision }}
    env:
      JRELEASER_IMAGE: ${{ inputs.jreleaser_image }}
      PACKAGE_VERSION_OVERRIDE: ${{ inputs.package_version }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v7
      - name: Install pinned Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Derive one strict X.Y.Z version
        id: version
        run: |
          tag="$GITHUB_REF_NAME"
          if [ -n "$PACKAGE_VERSION_OVERRIDE" ]; then
            version="$PACKAGE_VERSION_OVERRIDE"
            if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Version is not strict X.Y.Z: $version" >&2
              exit 1
            fi
            if [ "$GITHUB_REF_TYPE" = tag ] && [ "$tag" != "v$version" ]; then
              echo "Tag $tag differs from configured version v$version" >&2
              exit 1
            fi
          else
            if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Tag is not strict vX.Y.Z: $tag" >&2
              exit 1
            fi
            version="${tag#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Compare Nix package version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          NIX_PACKAGE_NAME: ${{ inputs.nix_package_name }}
        run: |
          nix_attr=".#packages.x86_64-linux.${NIX_PACKAGE_NAME}.version"
          test "$(nix eval --impure --raw "$nix_attr")" = "$VERSION"
      - name: Compare JReleaser project version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          JRELEASER_PROJECT_VERSION: ${{ steps.version.outputs.version }}
          JRELEASER_CONFIG: ${{ inputs.jreleaser_config }}
          JRELEASER_GITHUB_TOKEN: validation-only
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -e JRELEASER_PROJECT_VERSION \
            -e JRELEASER_GITHUB_TOKEN \
            "$JRELEASER_IMAGE" \
            config --strict --full --reproducible \
            --basedir /workspace \
            --config-file "$JRELEASER_CONFIG"
          test "$(sed -n 's/^projectVersion=//p' out/jreleaser/output.properties)" = "$VERSION"

  native-publish:
    name: Publish ${{ matrix.rid }} directory
    needs: version
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.package_publish_matrix) }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet_version }}
      - name: Confirm the native runner architecture
        shell: pwsh
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          $actual = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          $expected = $env:EXPECTED_MACHINE.ToLowerInvariant()
          $normalized = switch ($expected) {
            { $_ -in 'x64', 'x86_64', 'amd64' } { 'x64'; break }
            { $_ -in 'arm64', 'aarch64' } { 'arm64'; break }
            default { throw "Unsupported matrix machine: $expected" }
          }
          if ($actual -ne $normalized) { throw "Expected $expected ($normalized) runner, found $actual" }
      - name: Publish the caller-configured self-contained directory
        if: ${{ inputs.package_publish_script == '' }}
        shell: pwsh
        run: >-
          dotnet publish "${{ inputs.dotnet_project_path }}"
          --configuration Release
          --runtime "${{ matrix.rid }}"
          --self-contained true
          --output "artifacts/publish/${{ matrix.rid }}"
          -p:Version="${{ needs.version.outputs.version }}"
          -p:SourceRevisionId="${{ needs.version.outputs.revision }}"
          -p:DebugSymbols=false
          -p:DebugType=None
          -p:PublishSingleFile=false
      - name: Build the caller-configured complete payload
        if: ${{ inputs.package_publish_script != '' }}
        shell: pwsh
        env:
          PUBLISH_SCRIPT: ${{ inputs.package_publish_script }}
          RID: ${{ matrix.rid }}
          VERSION: ${{ needs.version.outputs.version }}
          REVISION: ${{ needs.version.outputs.revision }}
        run: |
          if ($IsWindows) {
            & "$env:PUBLISH_SCRIPT.ps1" -Rid $env:RID -PublishDirectory "artifacts/publish/$env:RID" -Version $env:VERSION -Revision $env:REVISION
            if (-not $?) { throw 'Caller publish failed' }
          } else {
            & bash "$env:PUBLISH_SCRIPT.sh" --rid "$env:RID" --publish-directory "artifacts/publish/$env:RID" --version "$env:VERSION" --revision "$env:REVISION"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Prepare the RID publish directory
        if: ${{ inputs.package_publish_prepare_script != '' }}
        shell: pwsh
        env:
          PREPARE_SCRIPT: ${{ inputs.package_publish_prepare_script }}
        run: |
          if ($IsWindows) {
            & "$env:PREPARE_SCRIPT.ps1" -Rid "${{ matrix.rid }}" -PublishDirectory "artifacts/publish/${{ matrix.rid }}"
            if (-not $?) { throw 'Caller prepare failed' }
          } else {
            & bash "$env:PREPARE_SCRIPT.sh" --rid "${{ matrix.rid }}" --publish-directory "artifacts/publish/${{ matrix.rid }}"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run the caller publish smoke
        shell: pwsh
        env:
          SMOKE_SCRIPT: ${{ inputs.package_smoke_script }}
          EXECUTABLE: ${{ matrix.executable }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if ($IsWindows) {
            & "$env:SMOKE_SCRIPT.ps1" -Executable $env:EXECUTABLE -Version $env:VERSION
            if (-not $?) { throw 'Caller smoke failed' }
          } else {
            & bash "$env:SMOKE_SCRIPT.sh" "$env:EXECUTABLE" --version "$env:VERSION"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload the RID publish directory
        uses: actions/upload-artifact@v7
        with:
          name: publish-${{ matrix.rid }}
          path: artifacts/publish
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release-assets:
    name: Assemble release assets
    needs:
      - version
      - native-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    env:
      JRELEASER_IMAGE: ${{ inputs.jreleaser_image }}
      JRELEASER_PROJECT_VERSION: ${{ needs.version.outputs.version }}
      JRELEASER_GITHUB_TOKEN: validation-only
      JRELEASER_CONFIG: ${{ inputs.jreleaser_config }}
    steps:
      - name: Check out release packaging
        uses: actions/checkout@v7
      - name: Check out shared release workflow helpers
        uses: actions/checkout@v7
        with:
          repository: alsi-lawr/package-release-workflows
          ref: ${{ inputs.shared_helpers_ref }}
          path: .shared-release-workflows
          persist-credentials: false
      - name: Download all publish directories
        uses: actions/download-artifact@v8
        with:
          pattern: publish-*
          path: artifacts/publish
          merge-multiple: true
      - name: Restore Unix command executable modes
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
          PACKAGE_PUBLISH_MATRIX: ${{ inputs.package_publish_matrix }}
        run: |
          bash "$GITHUB_WORKSPACE/.shared-release-workflows/.github/workflows/scripts/release-archives.sh" \
            restore --matrix "$PACKAGE_PUBLISH_MATRIX" --package-name "$PACKAGE_NAME" \
            --root artifacts/publish
      - name: Assemble release archives
        run: |
          for phase in assemble; do
            docker run --rm --user "$(id -u):$(id -g)" \
              -v "$PWD:/workspace" \
              -e JRELEASER_PROJECT_VERSION \
              -e JRELEASER_GITHUB_TOKEN \
              "$JRELEASER_IMAGE" \
              "$phase" --strict --reproducible \
              --basedir /workspace \
              --config-file "$JRELEASER_CONFIG"
          done
      - name: Reuse verified immutable release archives on rerun
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          PACKAGE_PUBLISH_MATRIX: ${{ inputs.package_publish_matrix }}
          VERSION: ${{ needs.version.outputs.version }}
          SOURCE_ARCHIVE_TEMPLATE: ${{ inputs.source_archive_template }}
        run: |
          "$GITHUB_WORKSPACE/.shared-release-workflows/.github/workflows/scripts/reuse-existing-release-assets.sh"
      - name: Install source finalizer Rust toolchain
        if: ${{ inputs.source_cargo_toolchain != '' }}
        env:
          SOURCE_CARGO_TOOLCHAIN: ${{ inputs.source_cargo_toolchain }}
        run: rustup toolchain install "$SOURCE_CARGO_TOOLCHAIN" --profile minimal
      - name: Generate checksums and package metadata
        run: |
          for phase in checksum prepare; do
            docker run --rm --user "$(id -u):$(id -g)" \
              -v "$PWD:/workspace" \
              -e JRELEASER_PROJECT_VERSION \
              -e JRELEASER_GITHUB_TOKEN \
              "$JRELEASER_IMAGE" \
              "$phase" --strict --reproducible \
              --basedir /workspace \
              --config-file "$JRELEASER_CONFIG"
          done
      - name: Collect release assets and finalize package metadata
        run: |
          mkdir -p artifacts/release artifacts/package-metadata
          find out/jreleaser/assemble -maxdepth 4 -type f \
            \( -name '*.tar.gz' -o -name '*.zip' \) \
            -exec cp {} artifacts/release/ \;
          cp out/jreleaser/checksums/checksums_sha256.txt artifacts/release/
          bash "${{ inputs.package_metadata_finalize_script }}" \
            --version "${{ needs.version.outputs.version }}" \
            --release-directory artifacts/release \
            --metadata-directory out/jreleaser/prepare
          cp -R out/jreleaser/prepare/. artifacts/package-metadata/
      - name: Verify selected platform release archives
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
          PACKAGE_PUBLISH_MATRIX: ${{ inputs.package_publish_matrix }}
          SOURCE_ARCHIVE_TEMPLATE: ${{ inputs.source_archive_template }}
          VERSION: ${{ needs.version.outputs.version }}
          REVISION: ${{ needs.version.outputs.revision }}
          EXISTING_SOURCE_SHA256: ${{ steps.reuse.outputs.source_sha256 }}
        run: |
          bash "$GITHUB_WORKSPACE/.shared-release-workflows/.github/workflows/scripts/release-archives.sh" \
            verify --matrix "$PACKAGE_PUBLISH_MATRIX" --package-name "$PACKAGE_NAME" \
            --root artifacts/release --source-archive-template "$SOURCE_ARCHIVE_TEMPLATE" \
            --version "$VERSION" --revision "$REVISION"
          if [ -n "$EXISTING_SOURCE_SHA256" ]; then
            source_name="${SOURCE_ARCHIVE_TEMPLATE//\{package_name\}/$PACKAGE_NAME}"
            source_name="${source_name//\{version\}/$VERSION}"
            echo "$EXISTING_SOURCE_SHA256  artifacts/release/$source_name" | sha256sum --check
          fi
      - name: Generate release asset provenance
        uses: actions/attest@v4
        with:
          subject-checksums: artifacts/release/checksums_sha256.txt
      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ needs.version.outputs.version }}
          path: artifacts/release
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload package metadata
        uses: actions/upload-artifact@v7
        with:
          name: package-metadata-${{ needs.version.outputs.version }}
          path: artifacts/package-metadata
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload the JReleaser workspace
        uses: actions/upload-artifact@v7
        with:
          name: jreleaser-workspace-${{ needs.version.outputs.version }}
          path: out/jreleaser
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  verify-downloaded-source:
    name: Verify downloaded source and release assets
    if: ${{ inputs.source_archive_template != '' }}
    needs:
      - version
      - release-assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out shared release workflow helpers
        uses: actions/checkout@v7
        with:
          repository: alsi-lawr/package-release-workflows
          ref: ${{ inputs.shared_helpers_ref }}
          path: .shared-release-workflows
          persist-credentials: false
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets-${{ needs.version.outputs.version }}
          path: artifacts/release
      - name: Verify downloaded assets and checksums
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
          PACKAGE_PUBLISH_MATRIX: ${{ inputs.package_publish_matrix }}
          SOURCE_ARCHIVE_TEMPLATE: ${{ inputs.source_archive_template }}
          VERSION: ${{ needs.version.outputs.version }}
          REVISION: ${{ needs.version.outputs.revision }}
        run: |
          bash "$GITHUB_WORKSPACE/.shared-release-workflows/.github/workflows/scripts/release-archives.sh" \
            verify --matrix "$PACKAGE_PUBLISH_MATRIX" --package-name "$PACKAGE_NAME" \
            --root artifacts/release --source-archive-template "$SOURCE_ARCHIVE_TEMPLATE" \
            --version "$VERSION" --revision "$REVISION"
          (cd artifacts/release && sha256sum --check checksums_sha256.txt)
