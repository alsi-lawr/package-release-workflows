name: Reusable Rust and Bun matrix

on:
  workflow_call:
    inputs:
      rids:
        description: JSON array of RID, runner, and Rust target entries.
        type: string
        required: false
        default: >-
          [{"rid":"linux-x64","runner":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"},{"rid":"linux-arm64","runner":"ubuntu-26.04-arm","target":"aarch64-unknown-linux-gnu"},{"rid":"osx-arm64","runner":"macos-latest","target":"aarch64-apple-darwin"},{"rid":"win-x64","runner":"windows-latest","target":"x86_64-pc-windows-msvc"},{"rid":"win-arm64","runner":"windows-11-vs2026-arm","target":"aarch64-pc-windows-msvc"}]
      script:
        description: Caller-owned Bash script receiving the RID as its only argument.
        type: string
        required: true

permissions:
  contents: read

jobs:
  target:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.rids) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.target }}
      - name: Run caller CI
        shell: bash
        env:
          CI_SCRIPT: ${{ inputs.script }}
          TARGET_RID: ${{ matrix.rid }}
        run: bash "$CI_SCRIPT" "$TARGET_RID"
