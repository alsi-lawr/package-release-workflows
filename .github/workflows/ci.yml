name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  package-tooling:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install shell check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq shellcheck
      - name: Validate workflow and shell syntax
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
          shellcheck .github/workflows/scripts/*.sh
      - run: bash .github/workflows/scripts/test-release-archives.sh
