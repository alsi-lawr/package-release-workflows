name: Reusable Package Release Core

on:
  workflow_call:
    inputs:
      version:
        description: Release version without the v prefix.
        type: string
        required: true
      revision:
        description: Source revision used for the package.
        type: string
        required: true
      package_name:
        description: Package identifier used in packaging artifacts and manifests.
        type: string
        required: true
      command_name:
        description: Installed command used for smoke verification.
        type: string
        default: ''
      windows_executable_name:
        description: Windows executable file name when it differs from the package command.
        type: string
        default: ''
      winget_scope:
        description: Requested WinGet installer scope.
        type: string
        default: machine
      winget_uninstall_key:
        description: HKCU uninstall key of an installed per-user WinGet package.
        type: string
        default: ''
      release_name:
        description: Human-friendly product title used for release titles.
        type: string
        default: ''
      container_smoke_script:
        description: Script used to validate GHCR images.
        type: string
        default: ''
      smoke_script:
        description: Repository-local installed-product smoke script base path (.sh on Unix, .ps1 on Windows).
        type: string
        default: ''
      brew_formula_path:
        description: Full path to brew formula artifact.
        type: string
        default: ''
      brew_cask_path:
        description: Optional supplied Linux cask in the release assets; selects it instead of the JReleaser formula.
        type: string
        default: ''
      brew_cask_tap_repo:
        description: Existing owner/repository tap for an explicitly published supplied cask.
        type: string
        default: ''
      brew_cask_smoke_script:
        description: Repository-local Linux AppImage smoke script base path (.sh).
        type: string
        default: ''
      scoop_manifest_path:
        description: Full path to scoop manifest artifact.
        type: string
        default: ''
      scoop_bucket_repo:
        description: Existing owner/repository Scoop bucket; falls back to the caller repository variable SCOOP_BUCKET_REPO.
        type: string
        default: ''
      chocolatey_nuspec_path:
        description: Full path to chocolatey nuspec.
        type: string
        default: ''
      winget_manifest_prefix:
        description: Path prefix to winget manifests (version appended automatically).
        type: string
        default: ''
      release_title_prefix:
        description: Release title prefix used for GitHub release titles.
        type: string
        default: ''
      publish_github_release:
        description: Create GitHub release.
        type: boolean
        default: false
      publish_homebrew:
        description: Publish via JReleaser Homebrew packager.
        type: boolean
        default: false
      publish_scoop:
        description: Publish via JReleaser Scoop packager.
        type: boolean
        default: false
      publish_winget:
        description: Publish via JReleaser Winget for a manual upstream PR.
        type: boolean
        default: false
      publish_nixpkgs:
        description: Push nixpkgs update for a manual upstream PR.
        type: boolean
        default: false
      publish_chocolatey:
        description: Build and push Chocolatey package artifact.
        type: boolean
        default: false
      publish_aur:
        description: Publish a supplied PKGBUILD and .SRCINFO to the AUR.
        type: boolean
        default: false
      aur_package_base:
        description: AUR package base used as the Git repository name.
        type: string
        default: ''
      aur_pkgbuild_path:
        description: PKGBUILD path in the release assets.
        type: string
        default: ''
      aur_srcinfo_path:
        description: .SRCINFO path in the release assets.
        type: string
        default: ''
      publish_docker_hub:
        description: Build and publish Docker Hub images.
        type: boolean
        default: false
      publish_nix_images:
        description: Build and publish GHCR images.
        type: boolean
        default: false
      promote_latest:
        description: Promote version tags to :latest on Docker Hub and GHCR.
        type: boolean
        default: false
      run_package_tests:
        description: Execute optional package installation and installed-product smoke checks via separate workflow.
        type: boolean
        default: false
      run_homebrew_test:
        description: Run the Homebrew install-and-smoke job.
        type: boolean
        default: false
      run_linux_cask_test:
        description: Run the optional Linux cask install-and-smoke job.
        type: boolean
        default: false
      run_windows_packaging_tests:
        description: Run the Scoop and Chocolatey install-and-smoke job.
        type: boolean
        default: false
      run_winget_test:
        description: Run the WinGet manifest validation and install-and-smoke job.
        type: boolean
        default: false
      jreleaser_image:
        description: JReleaser container image.
        type: string
        default: ''
      jreleaser_config:
        description: Path to JReleaser config file.
        type: string
        default: ''
      winget_upstream_repo:
        description: Upstream repository for WinGet PRs.
        type: string
        default: ''
      winget_fork_owner:
        description: Fork owner for WinGet branch creation.
        type: string
        default: ''
      winget_fork_repo:
        description: Fork repository for WinGet branch creation.
        type: string
        default: ''
      winget_branch_prefix:
        description: Reusable branch prefix for winget updates.
        type: string
        default: ''
      nix_upstream_repo:
        description: Upstream repository for Nixpkgs PRs.
        type: string
        default: ''
      nix_fork_owner:
        description: Fork owner for Nix updates.
        type: string
        default: ''
      nix_fork_repo:
        description: Fork repository for Nix updates.
        type: string
        default: ''
      nix_branch_prefix:
        description: Reusable branch prefix for nix updates.
        type: string
        default: ''
      nix_package_name:
        description: Nix package attribute name to update.
        type: string
        default: ''
      nix_package_template_path:
        description: Caller-relative Nixpkgs package template used for first publication.
        type: string
        default: ''
      nix_package_dependencies_path:
        description: Caller-relative Nix dependency file copied for first publication.
        type: string
        default: ''
      docker_build_matrix:
        description: JSON list for Docker Hub image build jobs.
        type: string
        default: ''
      docker_manifest_images:
        description: JSON array of Docker Hub images for architecture manifest creation.
        type: string
        default: ''
      ghcr_build_matrix:
        description: JSON list for GHCR image build jobs.
        type: string
        default: ''
      ghcr_manifest_images:
        description: JSON array of GHCR images for architecture manifest creation.
        type: string
        default: ''
      promotion_image_matrix:
        description: JSON array of images to promote as :latest.
        type: string
        default: ''
    secrets:
      PACKAGE_REPOSITORY_TOKEN:
        required: false
      CHOCOLATEY_API_KEY:
        required: false
      AUR_SSH_PRIVATE_KEY:
        required: false
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

env:
  RUN_RELEASE_SMOKES: ${{ vars.RUN_RELEASE_SMOKES != 'false' }}

jobs:
  validation:
    uses: alsi-lawr/package-release-workflows/.github/workflows/validation.yml@main
    with:
      version: ${{ inputs.version }}

  credential-preflight:
    name: Validate all enabled publication credentials
    runs-on: ubuntu-latest
    steps:
      - name: Fail before publication when an enabled channel lacks credentials
        env:
          PACKAGE_REPOSITORY_TOKEN: ${{ secrets.PACKAGE_REPOSITORY_TOKEN }}
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          PUBLISH_HOMEBREW: ${{ inputs.publish_homebrew }}
          BREW_CASK_PATH: ${{ inputs.brew_cask_path }}
          BREW_CASK_TAP_REPO: ${{ inputs.brew_cask_tap_repo }}
          PUBLISH_SCOOP: ${{ inputs.publish_scoop }}
          SCOOP_BUCKET_REPO: ${{ inputs.scoop_bucket_repo || vars.SCOOP_BUCKET_REPO }}
          PUBLISH_WINGET: ${{ inputs.publish_winget }}
          PUBLISH_NIXPKGS: ${{ inputs.publish_nixpkgs }}
          PUBLISH_CHOCOLATEY: ${{ inputs.publish_chocolatey }}
          PUBLISH_AUR: ${{ inputs.publish_aur }}
          AUR_PACKAGE_BASE: ${{ inputs.aur_package_base }}
          AUR_PKGBUILD_PATH: ${{ inputs.aur_pkgbuild_path }}
          AUR_SRCINFO_PATH: ${{ inputs.aur_srcinfo_path }}
          PUBLISH_DOCKER_HUB: ${{ inputs.publish_docker_hub }}
        run: |
          set -euo pipefail

          require_secret() {
            local value="$1"
            local name="$2"
            if test -z "$value"; then
              echo "::error::${name} is required by an enabled publication channel." >&2
              return 1
            fi
          }

          if [[ "$PUBLISH_HOMEBREW" == true || "$PUBLISH_SCOOP" == true || "$PUBLISH_WINGET" == true || "$PUBLISH_NIXPKGS" == true ]]; then
            require_secret "$PACKAGE_REPOSITORY_TOKEN" PACKAGE_REPOSITORY_TOKEN
          fi

          if [[ "$PUBLISH_HOMEBREW" == true && -n "$BREW_CASK_PATH" && -z "$BREW_CASK_TAP_REPO" ]]; then
            echo '::error::brew_cask_tap_repo is required to publish a supplied cask.' >&2
            exit 1
          fi

          if [[ "$PUBLISH_SCOOP" == true && -z "$SCOOP_BUCKET_REPO" ]]; then
            echo '::error::scoop_bucket_repo is required to publish a supplied manifest.' >&2
            exit 1
          fi

          if [[ "$PUBLISH_CHOCOLATEY" == true ]]; then
            require_secret "$CHOCOLATEY_API_KEY" CHOCOLATEY_API_KEY
          fi

          if [[ "$PUBLISH_AUR" == true ]]; then
            require_secret "$AUR_SSH_PRIVATE_KEY" AUR_SSH_PRIVATE_KEY
            if [[ -z "$AUR_PACKAGE_BASE" || -z "$AUR_PKGBUILD_PATH" || -z "$AUR_SRCINFO_PATH" ]]; then
              echo '::error::AUR publication needs a package base, PKGBUILD path, and .SRCINFO path.' >&2
              exit 1
            fi
          fi

          if [[ "$PUBLISH_DOCKER_HUB" == true ]]; then
            require_secret "$DOCKERHUB_USERNAME" DOCKERHUB_USERNAME
            require_secret "$DOCKERHUB_TOKEN" DOCKERHUB_TOKEN
          fi

  package-tests:
    name: Test packaging install-and-smoke targets
    if: ${{ always() && inputs.run_package_tests && !failure() && !cancelled() }}
    needs:
      - validation
      - credential-preflight
      - github-release
    uses: alsi-lawr/package-release-workflows/.github/workflows/release-package-tests.yml@main
    with:
      version: ${{ inputs.version }}
      command_name: ${{ inputs.command_name }}
      windows_executable_name: ${{ inputs.windows_executable_name }}
      winget_scope: ${{ inputs.winget_scope }}
      winget_uninstall_key: ${{ inputs.winget_uninstall_key }}
      smoke_script: ${{ inputs.smoke_script }}
      brew_formula_path: ${{ inputs.brew_formula_path }}
      brew_cask_path: ${{ inputs.brew_cask_path }}
      brew_cask_smoke_script: ${{ inputs.brew_cask_smoke_script }}
      scoop_manifest_path: ${{ inputs.scoop_manifest_path }}
      chocolatey_nuspec_path: ${{ inputs.chocolatey_nuspec_path }}
      winget_manifest_prefix: ${{ inputs.winget_manifest_prefix }}
      run_homebrew_test: ${{ inputs.run_homebrew_test }}
      run_linux_cask_test: ${{ inputs.run_linux_cask_test }}
      run_windows_packaging_tests: ${{ inputs.run_windows_packaging_tests }}
      run_winget_test: ${{ inputs.run_winget_test }}

  github-release:
    name: Create or verify the immutable GitHub release
    if: >-
      ${{
        always() &&
        !failure() &&
        !cancelled() &&
        (
          inputs.publish_github_release ||
          inputs.run_package_tests ||
          inputs.publish_homebrew ||
          inputs.publish_scoop ||
          inputs.publish_winget ||
          inputs.publish_chocolatey ||
          inputs.publish_aur
        )
      }}
    needs:
      - validation
      - credential-preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out shared release workflow helpers
        uses: actions/checkout@v7
        with:
          repository: alsi-lawr/package-release-workflows
          ref: main
          path: .shared-release-workflows
          persist-credentials: false
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets-${{ inputs.version }}
          path: artifacts/release
      - name: Create the release or verify its final assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_TITLE_PREFIX: ${{ inputs.release_title_prefix }}
          PUBLISH_GITHUB_RELEASE: ${{ inputs.publish_github_release }}
        run: |
          "$GITHUB_WORKSPACE/.shared-release-workflows/.github/workflows/scripts/verify-or-create-release.sh"

  publish-homebrew-scoop-winget:
    name: Publish Homebrew/Scoop/Winget metadata when authorised
    if: >-
      ${{
        always() &&
        (inputs.publish_homebrew || inputs.publish_scoop || inputs.publish_winget) &&
        !failure() &&
        !cancelled()
      }}
    needs:
      - package-tests
      - validation
      - credential-preflight
      - github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      JRELEASER_IMAGE: ${{ inputs.jreleaser_image }}
      JRELEASER_PROJECT_VERSION: ${{ inputs.version }}
      JRELEASER_GITHUB_TOKEN: ${{ secrets.PACKAGE_REPOSITORY_TOKEN }}
      PUBLISH_HOMEBREW: ${{ inputs.publish_homebrew }}
      BREW_CASK_PATH: ${{ inputs.brew_cask_path }}
      PUBLISH_SCOOP: ${{ inputs.publish_scoop }}
      SCOOP_MANIFEST_PATH: ${{ inputs.scoop_manifest_path }}
      SCOOP_BUCKET_REPO: ${{ inputs.scoop_bucket_repo || vars.SCOOP_BUCKET_REPO }}
      PUBLISH_WINGET: ${{ inputs.publish_winget }}
      WINGET_UPSTREAM_REPO: ${{ inputs.winget_upstream_repo }}
      WINGET_FORK_OWNER: ${{ inputs.winget_fork_owner }}
      WINGET_FORK_REPO: ${{ inputs.winget_fork_repo }}
      WINGET_BRANCH_PREFIX: ${{ inputs.winget_branch_prefix }}
    steps:
      - name: Check out publication configuration
        uses: actions/checkout@v7
      - name: Download the prepared JReleaser workspace
        uses: actions/download-artifact@v8
        with:
          name: jreleaser-workspace-${{ inputs.version }}
          path: out/jreleaser
      - name: Download release assets for package metadata
        uses: actions/download-artifact@v8
        with:
          name: release-assets-${{ inputs.version }}
          path: artifacts/release
      - name: Download prepared package metadata
        if: ${{ inputs.publish_winget }}
        uses: actions/download-artifact@v8
        with:
          name: package-metadata-${{ inputs.version }}
          path: artifacts/package-metadata
      - name: Check out shared release workflow helpers
        if: ${{ inputs.publish_scoop || inputs.publish_winget || (inputs.publish_homebrew && inputs.brew_cask_path != '') }}
        uses: actions/checkout@v7
        with:
          repository: alsi-lawr/package-release-workflows
          ref: main
          path: .shared-release-workflows
          persist-credentials: false
      - name: Prepare winget fork branch from upstream default branch
        id: sync-winget-branch
        if: ${{ inputs.publish_winget }}
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_REPOSITORY_TOKEN }}
          SYNC_VERSION: ${{ inputs.version }}
          SYNC_UPSTREAM_REPO: ${{ inputs.winget_upstream_repo }}
          SYNC_FORK_OWNER: ${{ inputs.winget_fork_owner }}
          SYNC_FORK_REPO: ${{ inputs.winget_fork_repo }}
          SYNC_BRANCH_PREFIX: ${{ inputs.winget_branch_prefix }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::PACKAGE_REPOSITORY_TOKEN is required for winget branch sync.' >&2
            exit 1
          fi
          "$GITHUB_WORKSPACE/.shared-release-workflows/.github/workflows/scripts/sync-fork-branch.sh"
      - name: Publish selected metadata packagers
        env:
          JRELEASER_CONFIG: ${{ inputs.jreleaser_config }}
          JRELEASER_PROJECT_VERSION: ${{ inputs.version }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.PACKAGE_REPOSITORY_TOKEN }}
        run: |
          if [ -z "$JRELEASER_GITHUB_TOKEN" ]; then
            echo '::error::PACKAGE_REPOSITORY_TOKEN is required for Homebrew/Scoop/Winget publication.' >&2
            exit 1
          fi
          PUBLISH_ARGS=()
          if [ "$PUBLISH_HOMEBREW" = "true" ] && [ -z "$BREW_CASK_PATH" ]; then
            PUBLISH_ARGS+=(--packager brew)
          fi
          if [ "${#PUBLISH_ARGS[@]}" -eq 0 ]; then
            echo 'No JReleaser metadata targets enabled; skipping publication step.'
            exit 0
          fi

          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -e JRELEASER_PROJECT_VERSION \
            -e JRELEASER_GITHUB_TOKEN \
            -e PUBLISH_SCOOP \
            -e PUBLISH_WINGET=false \
            "$JRELEASER_IMAGE" \
            publish --strict --reproducible \
            "${PUBLISH_ARGS[@]}" \
            --basedir /workspace \
            --config-file "$JRELEASER_CONFIG"
      - name: Publish supplied manifest to the selected Scoop bucket
        if: ${{ inputs.publish_scoop }}
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_REPOSITORY_TOKEN }}
          MANIFEST_PATH: ${{ inputs.scoop_manifest_path }}
          BUCKET_REPO: ${{ inputs.scoop_bucket_repo || vars.SCOOP_BUCKET_REPO }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          VERSION: ${{ inputs.version }}
        run: |
          "$GITHUB_WORKSPACE/.shared-release-workflows/.github/workflows/scripts/publish-supplied-scoop.sh"
      - name: Publish supplied Linux cask to the selected tap
        if: ${{ inputs.publish_homebrew && inputs.brew_cask_path != '' }}
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_REPOSITORY_TOKEN }}
          CASK_PATH: ${{ inputs.brew_cask_path }}
          TAP_REPO: ${{ inputs.brew_cask_tap_repo }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          VERSION: ${{ inputs.version }}
        run: |
          "$GITHUB_WORKSPACE/.shared-release-workflows/.github/workflows/scripts/publish-supplied-cask.sh"
      - name: Publish WinGet manifests to the prepared fork branch
        if: ${{ inputs.publish_winget }}
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_REPOSITORY_TOKEN }}
          WINGET_FORK_OWNER: ${{ inputs.winget_fork_owner }}
          WINGET_FORK_REPO: ${{ inputs.winget_fork_repo }}
          WINGET_BRANCH: ${{ steps.sync-winget-branch.outputs.branch }}
          WINGET_MANIFEST_DIRECTORY: ${{ inputs.winget_manifest_prefix }}/${{ inputs.version }}
        run: |
          "$GITHUB_WORKSPACE/.shared-release-workflows/.github/workflows/scripts/publish-winget-fork.sh"
      - name: Report the manual WinGet PR handoff
        if: ${{ inputs.publish_winget }}
        env:
          WINGET_UPSTREAM: ${{ inputs.winget_upstream_repo }}
          WINGET_FORK_OWNER: ${{ inputs.winget_fork_owner }}
          WINGET_BRANCH: ${{ steps.sync-winget-branch.outputs.branch }}
          WINGET_UPSTREAM_DEFAULT_BRANCH: ${{ steps.sync-winget-branch.outputs.upstream_default_branch }}
        run: |
          if test -z "$WINGET_BRANCH"; then
            echo '::error::WinGet branch was not prepared; cannot report the manual PR handoff.' >&2
            exit 1
          fi
          if test -z "$WINGET_UPSTREAM_DEFAULT_BRANCH"; then
            echo '::error::WinGet upstream default branch was not resolved; cannot report the manual PR handoff.' >&2
            exit 1
          fi

          echo "::notice::WinGet manifests were pushed to ${WINGET_FORK_OWNER}:${WINGET_BRANCH}. Open the upstream PR to ${WINGET_UPSTREAM}:${WINGET_UPSTREAM_DEFAULT_BRANCH} manually."

  publish-nixpkgs:
    name: Publish Nix package and prepare manual PR handoff
    if: ${{ always() && inputs.publish_nixpkgs && !failure() && !cancelled() }}
    needs:
      - package-tests
      - validation
      - credential-preflight
      - github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.PACKAGE_REPOSITORY_TOKEN }}
      GH_TOKEN: ${{ secrets.PACKAGE_REPOSITORY_TOKEN }}
      VERSION: ${{ inputs.version }}
      NIX_UPSTREAM: ${{ inputs.nix_upstream_repo }}
      NIX_FORK_OWNER: ${{ inputs.nix_fork_owner }}
      NIX_FORK_REPO: ${{ inputs.nix_fork_repo }}
      NIX_BRANCH_PREFIX: ${{ inputs.nix_branch_prefix }}
      NIX_PACKAGE: ${{ inputs.nix_package_name }}
      NIX_PACKAGE_TEMPLATE_PATH: ${{ inputs.nix_package_template_path }}
      NIX_PACKAGE_DEPENDENCIES_PATH: ${{ inputs.nix_package_dependencies_path }}
    steps:
      - name: Check out the caller release commit
        uses: actions/checkout@v7
      - name: Check out shared release workflow helpers
        uses: actions/checkout@v7
        with:
          repository: alsi-lawr/package-release-workflows
          ref: main
          path: .shared-release-workflows
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Sync Nixpkgs fork branch from upstream default branch
        id: sync-nix-branch
        env:
          SYNC_VERSION: ${{ inputs.version }}
          SYNC_UPSTREAM_REPO: ${{ inputs.nix_upstream_repo }}
          SYNC_FORK_OWNER: ${{ inputs.nix_fork_owner }}
          SYNC_FORK_REPO: ${{ inputs.nix_fork_repo }}
          SYNC_BRANCH_PREFIX: ${{ inputs.nix_branch_prefix }}
        run: |
          "$GITHUB_WORKSPACE/.shared-release-workflows/.github/workflows/scripts/sync-fork-branch.sh"
      - name: Add or update Nixpkgs, build it, and push the branch
        env:
          GH_TOKEN: ${{ env.GH_TOKEN }}
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
          VERSION: ${{ env.VERSION }}
          NIX_UPSTREAM: ${{ env.NIX_UPSTREAM }}
          NIX_FORK_OWNER: ${{ env.NIX_FORK_OWNER }}
          NIX_BRANCH: ${{ steps.sync-nix-branch.outputs.branch }}
          NIX_UPSTREAM_DEFAULT_BRANCH: ${{ steps.sync-nix-branch.outputs.upstream_default_branch }}
          NIX_PACKAGE: ${{ env.NIX_PACKAGE }}
          NIX_PACKAGE_TEMPLATE_PATH: ${{ env.NIX_PACKAGE_TEMPLATE_PATH }}
          NIX_PACKAGE_DEPENDENCIES_PATH: ${{ env.NIX_PACKAGE_DEPENDENCIES_PATH }}
        run: |
          "$GITHUB_WORKSPACE/.shared-release-workflows/.github/workflows/scripts/publish-nixpkgs.sh"

  publish-chocolatey:
    name: Build and submit the Chocolatey package for moderation
    if: ${{ always() && inputs.publish_chocolatey && !failure() && !cancelled() }}
    needs:
      - package-tests
      - validation
      - credential-preflight
      - github-release
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      PACKAGE_NAME: ${{ inputs.package_name }}
      VERSION: ${{ inputs.version }}
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
    steps:
      - name: Download JReleaser package metadata
        uses: actions/download-artifact@v8
        with:
          name: package-metadata-${{ inputs.version }}
          path: artifacts/package-metadata
      - name: Build the reviewable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/chocolatey | Out-Null
          choco pack "${{ inputs.chocolatey_nuspec_path }}" --output-directory artifacts/chocolatey
      - name: Upload the reviewable Chocolatey package
        uses: actions/upload-artifact@v7
        with:
          name: chocolatey-${{ inputs.version }}
          path: artifacts/chocolatey/${{ inputs.package_name }}.${{ inputs.version }}.nupkg
          if-no-files-found: error
          retention-days: 30
      - name: Submit the package for Chocolatey moderation
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CHOCOLATEY_API_KEY)) {
              Write-Host '::error::CHOCOLATEY_API_KEY is required for Chocolatey submission.'
              exit 1
          }
          choco push "artifacts/chocolatey/${{ inputs.package_name }}.${{ inputs.version }}.nupkg" `
            --source https://push.chocolatey.org/ `
            --api-key $env:CHOCOLATEY_API_KEY
          Write-Host '::notice::Chocolatey upload completed; public availability remains pending moderation.'

  publish-aur:
    name: Publish the AUR package
    if: ${{ always() && inputs.publish_aur && !failure() && !cancelled() }}
    needs:
      - package-tests
      - validation
      - credential-preflight
      - github-release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets-${{ inputs.version }}
          path: artifacts/release
      - name: Check out shared release workflow helpers
        uses: actions/checkout@v7
        with:
          repository: alsi-lawr/package-release-workflows
          ref: main
          path: .shared-release-workflows
          persist-credentials: false
      - name: Publish the AUR package
        env:
          AUR_PACKAGE_BASE: ${{ inputs.aur_package_base }}
          AUR_PKGBUILD: ${{ inputs.aur_pkgbuild_path }}
          AUR_SRCINFO: ${{ inputs.aur_srcinfo_path }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          VERSION: ${{ inputs.version }}
        run: |
          key="$RUNNER_TEMP/aur-key"
          known_hosts="$RUNNER_TEMP/aur-known-hosts"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$key"
          chmod 600 "$key"
          printf '%s\n' 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > "$known_hosts"
          fingerprint=$(ssh-keygen -lf "$known_hosts" | awk '{ print $2 }')
          test "$fingerprint" = 'SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4'
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts"
          export AUR_REMOTE="ssh://aur@aur.archlinux.org/${AUR_PACKAGE_BASE}.git"
          "$GITHUB_WORKSPACE/.shared-release-workflows/.github/workflows/scripts/publish-aur-package.sh"

  docker-hub-images:
    name: Publish Docker Hub ${{ matrix.kind }} ${{ matrix.arch }}
    if: ${{ always() && inputs.publish_docker_hub && !failure() && !cancelled() }}
    needs:
      - validation
      - credential-preflight
      - github-release
      - package-tests
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.docker_build_matrix) }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v7
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Build and push the architecture tag
        env:
          VERSION: ${{ inputs.version }}
          REVISION: ${{ inputs.revision }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker build \
            --file "$DOCKERFILE" \
            --tag "$IMAGE:${VERSION}-${ARCH}" \
            --build-arg PACKAGE_VERSION="$VERSION" \
            --build-arg VERSION="$VERSION" \
            --build-arg APP_VERSION="$VERSION" \
            --build-arg SOURCE_REVISION_ID="$REVISION" \
            .
          docker push "$IMAGE:${VERSION}-${ARCH}"

  docker-hub-manifests:
    name: Publish Docker Hub ${{ matrix.image }} manifest
    if: ${{ always() && inputs.publish_docker_hub && needs.docker-hub-images.result == 'success' }}
    needs:
      - docker-hub-images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ${{ fromJson(inputs.docker_manifest_images) }}
    steps:
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Publish the multi-architecture version tag
        env:
          VERSION: ${{ inputs.version }}
          IMAGE: ${{ matrix.image }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"

  nix-images:
    name: Build, smoke, and publish Nix ${{ matrix.kind }} ${{ matrix.arch }}
    if: ${{ always() && inputs.publish_nix_images && !failure() && !cancelled() }}
    needs:
      - validation
      - credential-preflight
      - github-release
      - package-tests
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.ghcr_build_matrix) }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Build, optionally smoke, and tag the Nix image
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          VERSION: ${{ inputs.version }}
          REVISION: ${{ inputs.revision }}
          NIX_IMAGE_VERSION: ${{ inputs.version }}
          OUTPUT: ${{ matrix.output }}
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
          SMOKE_KIND: ${{ matrix.smoke_kind }}
          CONTAINER_SMOKE_SCRIPT: ${{ inputs.container_smoke_script }}
        run: |
          nix build --impure ".#$OUTPUT" --out-link result-image
          loaded=$(docker load < result-image | sed -n 's/^Loaded image: //p' | tail -n 1)
          if [[ "$RUN_RELEASE_SMOKES" == true ]]; then
            bash "$CONTAINER_SMOKE_SCRIPT" \
              --image "$loaded" \
              --kind "$SMOKE_KIND" \
              --version "$VERSION" \
              --revision "$REVISION"
          else
            echo '::notice::Caller Nix-container smoke skipped: RUN_RELEASE_SMOKES=false.'
          fi
          docker tag "$loaded" "${IMAGE}:${VERSION}-${ARCH}"
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Push the architecture tag
        env:
          VERSION: ${{ inputs.version }}
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: docker push "${IMAGE}:${VERSION}-${ARCH}"

  nix-manifests:
    name: Publish Nix GHCR ${{ matrix.image }} manifest
    if: ${{ always() && inputs.publish_nix_images && needs.nix-images.result == 'success' }}
    needs:
      - nix-images
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        image: ${{ fromJson(inputs.ghcr_manifest_images) }}
    steps:
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Publish the multi-architecture version tag
        env:
          VERSION: ${{ inputs.version }}
          IMAGE: ${{ matrix.image }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"

  promote-latest:
    name: Promote the release version to latest
    if: >-
      ${{
        always() &&
        inputs.promote_latest &&
        (inputs.publish_github_release || inputs.publish_docker_hub || inputs.publish_nix_images) &&
        !failure() &&
        !cancelled()
      }}
    needs:
      - validation
      - credential-preflight
      - package-tests
      - github-release
      - publish-homebrew-scoop-winget
      - publish-nixpkgs
      - publish-chocolatey
      - publish-aur
      - docker-hub-manifests
      - nix-manifests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Log in to Docker Hub
        if: ${{ inputs.publish_docker_hub }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Promote Docker Hub version tags
        if: ${{ inputs.publish_docker_hub }}
        env:
          VERSION: ${{ inputs.version }}
          IMAGES: ${{ inputs.promotion_image_matrix }}
        run: |
          while IFS= read -r image; do
            docker buildx imagetools create --tag "$image:latest" "$image:$VERSION"
          done < <(jq -r '.[] | select(startswith("docker.io/"))' <<<"$IMAGES")
      - name: Log in to GHCR
        if: ${{ inputs.publish_nix_images }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Promote GHCR version tags
        if: ${{ inputs.publish_nix_images }}
        env:
          VERSION: ${{ inputs.version }}
          IMAGES: ${{ inputs.promotion_image_matrix }}
        run: |
          while IFS= read -r image; do
            docker buildx imagetools create --tag "$image:latest" "$image:$VERSION"
          done < <(jq -r '.[] | select(startswith("ghcr.io/"))' <<<"$IMAGES")
      - name: Promote the GitHub release to Latest
        if: ${{ inputs.publish_github_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --latest
