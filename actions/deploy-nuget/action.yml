name: Deploy NuGet package
description: Pack and publish one .NET project to NuGet.org with trusted publishing

inputs:
  project:
    description: Path to the project to pack
    required: true
  user:
    description: NuGet.org profile name
    required: true
  dotnet-version:
    description: .NET SDK version
    required: false
    default: 10.0.x

runs:
  using: composite
  steps:
    - name: Read package version
      id: version
      shell: bash
      run: |
        if [[ "$GITHUB_REF_TYPE" != "tag" \
          || ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
        then
          echo "Expected a version tag in the form vX.Y.Z, got '$GITHUB_REF_NAME'." >&2
          exit 1
        fi

        echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Pack
      id: pack
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        PROJECT: ${{ inputs.project }}
        VERSION: ${{ steps.version.outputs.value }}
      run: |
        package_directory="$RUNNER_TEMP/nuget-package"
        mkdir -p "$package_directory"

        dotnet pack "$PROJECT" \
          --configuration Release \
          --output "$package_directory" \
          -p:PackageVersion="$VERSION" \
          -p:ContinuousIntegrationBuild=true \
          -p:RepositoryCommit="$GITHUB_SHA"

        mapfile -t packages < <(find "$package_directory" -maxdepth 1 -type f -name '*.nupkg')
        mapfile -t symbols < <(find "$package_directory" -maxdepth 1 -type f -name '*.snupkg')

        if [[ "${#packages[@]}" -ne 1 || "${#symbols[@]}" -ne 1 ]]
        then
          echo "Expected one nupkg and one snupkg." >&2
          find "$package_directory" -maxdepth 1 -type f -printf '%f\n' >&2
          exit 1
        fi

        echo "path=${packages[0]}" >> "$GITHUB_OUTPUT"

    - name: Log in to NuGet.org
      id: login
      uses: NuGet/login@v1
      with:
        user: ${{ inputs.user }}

    - name: Publish
      shell: bash
      env:
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        PACKAGE: ${{ steps.pack.outputs.path }}
      run: >-
        dotnet nuget push "$PACKAGE"
        --api-key "$NUGET_API_KEY"
        --source https://api.nuget.org/v3/index.json
