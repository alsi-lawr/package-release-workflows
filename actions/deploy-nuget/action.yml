name: Deploy NuGet package
description: Pack and publish one .NET project to NuGet.org with trusted publishing

inputs:
  project:
    description: Path to the project to pack
    required: true
  user:
    description: NuGet.org profile name
    required: true
  dotnet-version:
    description: .NET SDK version
    required: false
    default: 10.0.x
  tag:
    description: Version tag to publish when the workflow is manually retried
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Read package version
      id: version
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        RELEASE_TAG: ${{ inputs.tag }}
      run: |
        if [[ -z "$RELEASE_TAG" ]]
        then
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]
          then
            echo "Expected a tag event or an explicit tag." >&2
            exit 1
          fi

          RELEASE_TAG="$GITHUB_REF_NAME"
        fi

        if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
        then
          echo "Expected a version tag in the form vX.Y.Z, got '$RELEASE_TAG'." >&2
          exit 1
        fi

        tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
        checkout_commit="$(git rev-parse HEAD)"

        if [[ "$tag_commit" != "$checkout_commit" ]]
        then
          echo "The checkout does not match $RELEASE_TAG." >&2
          exit 1
        fi

        echo "commit=$checkout_commit" >> "$GITHUB_OUTPUT"
        echo "value=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Pack
      id: pack
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        COMMIT: ${{ steps.version.outputs.commit }}
        PROJECT: ${{ inputs.project }}
        VERSION: ${{ steps.version.outputs.value }}
      run: |
        package_directory="$RUNNER_TEMP/nuget-package"
        mkdir -p "$package_directory"

        dotnet pack "$PROJECT" \
          --configuration Release \
          --output "$package_directory" \
          -p:PackageVersion="$VERSION" \
          -p:ContinuousIntegrationBuild=true \
          -p:RepositoryCommit="$COMMIT"

        mapfile -t packages < <(find "$package_directory" -maxdepth 1 -type f -name '*.nupkg')
        mapfile -t symbols < <(find "$package_directory" -maxdepth 1 -type f -name '*.snupkg')

        if [[ "${#packages[@]}" -ne 1 || "${#symbols[@]}" -ne 1 ]]
        then
          echo "Expected one nupkg and one snupkg." >&2
          find "$package_directory" -maxdepth 1 -type f -printf '%f\n' >&2
          exit 1
        fi

        echo "path=${packages[0]}" >> "$GITHUB_OUTPUT"

    - name: Log in to NuGet.org
      id: login
      uses: NuGet/login@v1
      with:
        user: ${{ inputs.user }}

    - name: Publish
      shell: bash
      env:
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        PACKAGE: ${{ steps.pack.outputs.path }}
      run: >-
        dotnet nuget push "$PACKAGE"
        --api-key "$NUGET_API_KEY"
        --source https://api.nuget.org/v3/index.json
